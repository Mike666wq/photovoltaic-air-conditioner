name: Client Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: '试装版本（例如 0.1.0-rc1）；不会创建公开 Release'
        required: true
        default: '0.1.0-rc1'
      version_code:
        description: 'Android递增版本号，正式升级必须大于已发布版本'
        required: true
        default: '1'
  push:
    tags: ['client-v*']

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      code: ${{ steps.meta.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CODE: ${{ inputs.version_code }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^client-v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]
            VERSION="${GITHUB_REF_NAME#client-v}"
            MAJOR="${BASH_REMATCH[1]}"; MINOR="${BASH_REMATCH[2]}"; PATCH="${BASH_REMATCH[3]}"
            ((10#$MAJOR < 100 && 10#$MINOR < 100 && 10#$PATCH < 100))
            CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH + 1))
            git fetch origin main
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          else
            [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]
            [[ "$INPUT_CODE" =~ ^[1-9][0-9]{0,8}$ ]]
            VERSION="$INPUT_VERSION"; CODE="$INPUT_CODE"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
  android:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Decode private signing material
        env:
          KEYSTORE: ${{ secrets.PVAC_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PVAC_ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PVAC_ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PVAC_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE" && test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD" && test -n "$KEY_ALIAS"
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/pvac-release.p12"
      - name: Build signed APK
        working-directory: clients/android
        env:
          PVAC_VERSION: ${{ needs.metadata.outputs.version }}
          PVAC_VERSION_CODE: ${{ needs.metadata.outputs.code }}
          PVAC_BUILD_SHA: ${{ github.sha }}
          PVAC_ANDROID_KEYSTORE: ${{ runner.temp }}/pvac-release.p12
          PVAC_ANDROID_STORE_PASSWORD: ${{ secrets.PVAC_ANDROID_STORE_PASSWORD }}
          PVAC_ANDROID_KEY_PASSWORD: ${{ secrets.PVAC_ANDROID_KEY_PASSWORD }}
          PVAC_ANDROID_KEY_ALIAS: ${{ secrets.PVAC_ANDROID_KEY_ALIAS }}
        run: gradle --no-daemon :app:lintRelease :app:assembleRelease
      - name: Verify signature and stage
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          APK=clients/android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mkdir -p clients/artifacts
          cp "$APK" "clients/artifacts/pvac-monitor-$VERSION-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-package
          path: clients/artifacts/*.apk
          if-no-files-found: error
      - name: Remove ephemeral signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/pvac-release.p12"
  windows:
    needs: metadata
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build installer
        shell: pwsh
        env:
          PVAC_VERSION: ${{ needs.metadata.outputs.version }}
          PVAC_BUILD_SHA: ${{ github.sha }}
        run: ./clients/windows/build.ps1 -Iscc "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: clients/artifacts/*.exe
          if-no-files-found: error
  assemble:
    needs: [metadata, android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-package'
          path: packages
          merge-multiple: true
      - name: Checksums and install instructions
        working-directory: packages
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -name '*.apk' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name '*.exe' | wc -l)" -eq 1
          sha256sum *.apk *.exe > SHA256SUMS.txt
          cp ../deploy/CLIENT-INSTALL.md INSTALL.md
      - uses: actions/upload-artifact@v4
        with:
          name: client-installers
          path: packages/*
          if-no-files-found: error
      - name: Publish verified client tag
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" packages/* --verify-tag --title "光伏·空调监控 ${{ needs.metadata.outputs.version }}" --notes-file deploy/CLIENT-INSTALL.md
