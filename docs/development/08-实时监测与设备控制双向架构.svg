<text x="96" y="1052" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="21" text-anchor="start" fill="#236c59">反馈闭环：实际动作 → 状态 / 测量回到阶段一 → 云端判断与页面确认；命令回显不能冒充物理反馈。</text>
<text x="96" y="1078" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="19" text-anchor="start" fill="#236c59">网关不是强电开关。急停、保护与快速闭环留在本地；设备停机与恢复策略按厂家和现场方案定义。</text>
<text x="78" y="1227" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="19" text-anchor="start" fill="#65768c">备选传输：需要 MQTT 时，以 MQTT 5 / TLS 承载网关↔云端两向业务；Web 仍通过应用 API / SSE。</text>
