<svg xmlns="http://www.w3.org/2000/svg" width="1940" height="1280" viewBox="0 0 1940 1280" role="img" aria-labelledby="title desc"><title id="title">光伏空调实验平台实时监测与设备控制双向架构</title><desc id="desc">上方蓝色链路由现场仪器经采集接口、边缘网关、云端到页面，下方橙色链路由网页决策经云端、边缘、本地控制与驱动到实验设备，绿色反馈线回到上行测量。全部硬件和技术栈为待现场确认的候选方案。</desc><rect width="1940" height="1280" fill="#f7f9fc"/>
<text x="62" y="67" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="36" font-weight="600" text-anchor="start" fill="#172942">光伏·空调实验平台：实时数据上行与设备控制下行</text>
<text x="64" y="111" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif" font-size="21" text-anchor="start" fill="#627189">候选实施架构｜硬件型号、点表和控制范围经现场确认后确定｜阶段一先只读，阶段二逐设备开放操控</text>
