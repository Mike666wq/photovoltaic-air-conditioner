<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" width="240" height="80" id="water-line">
  <defs>
    <linearGradient id="wlG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD"/><stop offset="50%" stop-color="#1D6996"/><stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <radialGradient id="wlGl" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1D6996" stop-opacity="0.9"/><stop offset="100%" stop-color="#1D6996" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wlGl2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.95"/><stop offset="100%" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1D6996"/>
    </marker>
    <filter id="gl17"><feGaussianBlur stdDeviation="1.5"/></filter>
    <filter id="gl17S"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>
  <style>
    .anim-wl-particle {
      opacity: 0;
      animation: wl-flow 3s linear infinite;
    }
    @keyframes wl-flow {
      0%   { transform: translateX(0);    opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateX(200px); opacity: 0; }
    }
    /* 水滴闪烁 */
    .wl-drop { animation: drop-pulse 1.2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes drop-pulse { 0%,100% { opacity: 0.7; transform: scale(1); } 50% { opacity: 1; transform: scale(1.1); } }
    /* 流向箭头 */
    .wl-arrow { animation: arrow-slide 2s ease-in-out infinite; }
    @keyframes arrow-slide { 0%,100% { transform: translateX(0); } 50% { transform: translateX(4px); } }
    /* 停泵 */
    [data-anim-state="off"] .anim-wl-particle { animation-play-state: paused; opacity: 0.3; }
  </style>

  <!-- 标题栏 -->
  <rect x="2" y="2" width="236" height="14" rx="2" fill="#1E3A8A"/>
  <g class="wl-drop" transform="translate(8,9)">
    <path d="M0,-3 C-2,-1 -3,1 -3,2 C-3,3.5 -1.5,4.5 0,4.5 C1.5,4.5 3,3.5 3,2 C3,1 2,-1 0,-3 Z" fill="#93C5FD"/>
  </g>
  <text x="18" y="11" font-size="8" font-weight="bold" fill="white" font-family="sans-serif">WATER LINE · 水线</text>
  <text data-field="wl_label" x="232" y="11" text-anchor="end" font-size="7" fill="#93C5FD" font-family="monospace">{{wl_label}}</text>

  <!-- 双管：供水（实线波浪）+ 回水（虚线）-->
  <path d="M 36 32 Q 56 24 76 32 T 116 32 T 156 32 T 196 32 T 220 32" fill="none" stroke="#1D6996" stroke-width="4" stroke-linecap="round" marker-end="url(#arrB)"/>
  <path d="M 36 32 Q 56 24 76 32 T 116 32 T 156 32 T 196 32 T 220 32" fill="none" stroke="url(#wlG)" stroke-width="2" stroke-linecap="round"/>
  <path d="M 36 54 Q 56 46 76 54 T 116 54 T 156 54 T 196 54 T 220 54" fill="none" stroke="#1D6996" stroke-width="4" stroke-linecap="round" stroke-dasharray="5 3"/>

  <!-- 供水/回水色块标签 -->
  <g>
    <rect x="2" y="28" width="32" height="9" rx="1.5" fill="rgba(147,197,253,0.95)" stroke="#1D6996" stroke-width="0.5"/>
    <text x="18" y="34.5" text-anchor="middle" font-size="6" fill="#1E3A8A" font-family="sans-serif" font-weight="bold">供水·H2O</text>

    <rect x="2" y="50" width="32" height="9" rx="1.5" fill="rgba(191,219,254,0.95)" stroke="#1D6996" stroke-width="0.5"/>
    <text x="18" y="56.5" text-anchor="middle" font-size="6" fill="#1E3A8A" font-family="sans-serif" font-weight="bold">回水·H2O</text>
  </g>

  <!-- 流动粒子（更大更亮，金色对比蓝色线条）-->
  <g data-field="wl_particles" data-component-id="water-line" data-anim-state="on" data-animation-id="wl_anim_speed">
    <!-- 供水线粒子（亮金，对比蓝色线条）-->
    <circle class="anim-wl-particle" cx="36" cy="32" r="3.5" fill="#FCD34D" stroke="#FFFFFF" stroke-width="0.6" filter="url(#gl17S)"/>
    <circle class="anim-wl-particle" cx="36" cy="32" r="3"   fill="#FCD34D" stroke="#FFFFFF" stroke-width="0.6" filter="url(#gl17S)"/>
    <circle class="anim-wl-particle" cx="36" cy="32" r="4"   fill="#FCD34D" stroke="#FFFFFF" stroke-width="0.6" filter="url(#gl17S)"/>
    <circle class="anim-wl-particle" cx="36" cy="32" r="3"   fill="#FCD34D" stroke="#FFFFFF" stroke-width="0.6" filter="url(#gl17S)"/>
    <circle class="anim-wl-particle" cx="36" cy="32" r="3.5" fill="#FCD34D" stroke="#FFFFFF" stroke-width="0.6" filter="url(#gl17S)"/>
    <!-- 回水线粒子（白色，对比蓝色线条）-->
    <circle class="anim-wl-particle" cx="36" cy="54" r="3"   fill="#FFFFFF" stroke="#60A5FA" stroke-width="0.6" filter="url(#gl17)"/>
    <circle class="anim-wl-particle" cx="36" cy="54" r="3.5" fill="#FFFFFF" stroke="#60A5FA" stroke-width="0.6" filter="url(#gl17)"/>
    <circle class="anim-wl-particle" cx="36" cy="54" r="3"   fill="#FFFFFF" stroke="#60A5FA" stroke-width="0.6" filter="url(#gl17)"/>
  </g>

  <!-- 流向箭头 -->
  <g class="wl-arrow" transform="translate(195, 32)">
    <path d="M0,-3 L4,0 L0,3" stroke="#93C5FD" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>