<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" id="heat-pump">
  <defs>
    <linearGradient id="hpC" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="50%" stop-color="#F3F4F6"/><stop offset="100%" stop-color="#D1D5DB"/>
    </linearGradient>
    <linearGradient id="hpS" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9CA3AF"/><stop offset="100%" stop-color="#374151"/>
    </linearGradient>
    <radialGradient id="hpFan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D1D5DB"/><stop offset="60%" stop-color="#6B7280"/><stop offset="100%" stop-color="#1F2937"/>
    </radialGradient>
    <radialGradient id="hpHub" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F3F4F6"/><stop offset="100%" stop-color="#1F2937"/>
    </radialGradient>
    <linearGradient id="lcd4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617"/><stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="compG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/><stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="hpCopper" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350F"/><stop offset="50%" stop-color="#F59E0B"/><stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <radialGradient id="ledB4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#BAE6FD"/><stop offset="50%" stop-color="#0EA5E9"/><stop offset="100%" stop-color="#0C4A6E"/>
    </radialGradient>
    <radialGradient id="ledO4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FED7AA"/><stop offset="50%" stop-color="#F97316"/><stop offset="100%" stop-color="#7C2D12"/>
    </radialGradient>
    <radialGradient id="ledG4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#BBF7D0"/><stop offset="50%" stop-color="#22C55E"/><stop offset="100%" stop-color="#14532D"/>
    </radialGradient>
    <radialGradient id="ledGl4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.5"/><stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <filter id="ds4"><feDropShadow dx="2" dy="4" stdDeviation="2.5" flood-color="#000" flood-opacity="0.35"/></filter>
    <filter id="gl4"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <style>
    /* 风扇：开时旋转 (on/cool/heat 都视为运行中) */
    .anim-fan { transform-origin: 120px 75px; transform-box: view-box; }
    [data-anim-state="on"] .anim-fan,
    [data-anim-state="cool"] .anim-fan,
    [data-anim-state="heat"] .anim-fan { animation: fan-spin var(--anim-fan-duration, 1.2s) linear infinite; }
    @keyframes fan-spin { to { transform: rotate(360deg); } }
    /* 压缩机脉动 */
    [data-anim-state="on"] .anim-compressor,
    [data-anim-state="cool"] .anim-compressor,
    [data-anim-state="heat"] .anim-compressor { animation: comp-pulse 0.5s ease-in-out infinite; }
    @keyframes comp-pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    /* 活塞往复 */
    [data-anim-state="on"] .anim-piston,
    [data-anim-state="cool"] .anim-piston,
    [data-anim-state="heat"] .anim-piston { animation: piston-stroke 0.5s ease-in-out infinite; }
    @keyframes piston-stroke { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    /* 制冷剂管线 */
    [data-anim-state="cool"] .anim-refrigerant-flow,
    [data-anim-state="heat"] .anim-refrigerant-flow {
      animation: ref-flow 1s linear infinite;
    }
    [data-anim-state="heat"] .anim-refrigerant-flow { animation-direction: reverse; }
    @keyframes ref-flow { to { stroke-dashoffset: -10; } }
    /* 铜管内水流（v0.4.4: 4 根错开延迟） */
    .anim-hp-water { opacity: 0; }
    [data-anim-state="on"] .anim-hp-water,
    [data-anim-state="cool"] .anim-hp-water,
    [data-anim-state="heat"] .anim-hp-water { opacity: 1; animation: hp-water-flow 1.5s linear infinite; }
    .anim-hp-water.ahw-1 { animation-delay: 0s; }
    .anim-hp-water.ahw-2 { animation-delay: 0.4s; }
    .anim-hp-water.ahw-3 { animation-delay: 0.8s; }
    .anim-hp-water.ahw-4 { animation-delay: 1.2s; }
    @keyframes hp-water-flow { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(8px); opacity: 0; } }
  </style>

  <ellipse cx="120" cy="216" rx="95" ry="9" fill="rgba(0,0,0,0.35)"/>

  <g data-field="hp_mode_icon_g" opacity="0.7">
    <text data-field="hp_mode_icon" x="120" y="22" text-anchor="middle" font-size="20" fill="#0EA5E9" font-family="sans-serif">{{hp_mode_icon}}</text>
  </g>

  <g filter="url(#ds4)" data-component-id="heat-pump" data-clickable="true" data-anim-state="on" data-hp-mode="cool">
    <polygon points="30,75 120,52 210,75 120,98" fill="url(#hpC)"/>
    <polygon points="30,75 30,195 120,220 120,98" fill="url(#hpS)"/>
    <polygon points="210,75 210,195 120,220 120,98" fill="#FAFAFA"/>

    <rect x="30" y="30" width="180" height="20" rx="2" fill="#0F172A"/>
    <text x="120" y="44" text-anchor="middle" font-size="11" font-weight="bold" fill="#FCD34D" font-family="sans-serif">HEAT PUMP 热泵机组</text>

    <ellipse cx="120" cy="75" rx="68" ry="22" fill="#1F2937"/>
    <ellipse cx="120" cy="75" rx="60" ry="18" fill="#0F172A"/>
    <ellipse cx="120" cy="75" rx="60" ry="18" fill="none" stroke="#4B5563" stroke-width="1"/>
    <g class="anim-fan" data-animation-id="hp_anim_fan" data-animation-type="rotate">
      <g transform="translate(120,75)" opacity="0.95">
        <g fill="url(#hpFan)" stroke="#1F2937" stroke-width="0.6">
          <path d="M 0 0 Q 18 -8 32 0 Q 18 8 0 0 Z"/>
          <path d="M 0 0 Q 18 -8 32 0 Q 18 8 0 0 Z" transform="rotate(72)"/>
          <path d="M 0 0 Q 18 -8 32 0 Q 18 8 0 0 Z" transform="rotate(144)"/>
          <path d="M 0 0 Q 18 -8 32 0 Q 18 8 0 0 Z" transform="rotate(216)"/>
          <path d="M 0 0 Q 18 -8 32 0 Q 18 8 0 0 Z" transform="rotate(288)"/>
        </g>
        <circle r="7" fill="url(#hpHub)"/>
        <circle r="3" fill="#1F2937"/>
      </g>
    </g>

    <rect x="38" y="106" width="60" height="50" rx="3" fill="#1F2937" stroke="#374151" stroke-width="0.8"/>
    <rect x="40" y="108" width="56" height="46" fill="#0F172A"/>
    <text x="68" y="120" text-anchor="middle" font-size="6" fill="#9CA3AF" font-family="monospace">COMPRESSOR</text>
    <g class="anim-compressor" data-animation-id="hp_anim_compressor">
      <circle cx="68" cy="138" r="14" fill="url(#compG)" stroke="#1F2937" stroke-width="0.8"/>
      <g class="anim-piston">
        <rect x="65" y="124" width="6" height="14" fill="#374151" stroke="#1F2937" stroke-width="0.5"/>
        <circle cx="68" cy="124" r="3" fill="#9CA3AF"/>
      </g>
      <line x1="68" y1="124" x2="68" y2="152" stroke="#9CA3AF" stroke-width="1"/>
    </g>
    <text x="68" y="158" text-anchor="middle" font-size="5" fill="#FCD34D" font-family="monospace">压缩机</text>

    <rect x="108" y="106" width="94" height="50" rx="3" fill="url(#lcd4)" stroke="#1F2937" stroke-width="1"/>
    <rect x="110" y="108" width="90" height="46" fill="#0F172A"/>
    <text data-field="hp_mode" x="115" y="120" font-size="7" fill="#9CA3AF" font-family="monospace">{{hp_mode}}</text>
    <text data-field="hp_temp" x="115" y="142" font-size="18" font-weight="bold" fill="#FCD34D" font-family="monospace">{{hp_temp}}</text>
    <text data-field="hp_cop" x="170" y="142" font-size="8" fill="#0EA5E9" font-family="monospace">{{hp_cop}}</text>
    <text data-field="hp_power" x="115" y="152" font-size="7" fill="#22C55E" font-family="monospace">{{hp_power}}</text>

    <g fill="#1F2937">
      <rect x="38" y="160" width="164" height="2"/><rect x="38" y="164" width="164" height="2"/>
      <rect x="38" y="168" width="164" height="2"/><rect x="38" y="172" width="164" height="2"/>
      <rect x="38" y="176" width="164" height="2"/>
    </g>

    <circle data-field="hp_status_glow" cx="48" cy="190" r="6" fill="url(#ledGl4)" filter="url(#gl4)"/>
    <circle data-field="hp_status_led" cx="48" cy="190" r="3.5" fill="url(#ledB4)"/>
    <text data-field="hp_status_text" x="60" y="193" font-size="8" fill="#0EA5E9" font-family="monospace">{{hp_status_text}}</text>

    <g data-animation-id="hp_anim_refrigerant">
      <rect x="100" y="206" width="8" height="14" fill="#93C5FD" stroke="#1F2937" stroke-width="0.5"/>
      <line class="anim-refrigerant-flow" x1="100" y1="210" x2="108" y2="210" stroke="#0EA5E9" stroke-width="2" stroke-dasharray="3,2"/>
      <text x="104" y="216" text-anchor="middle" font-size="5" fill="#1F2937" font-family="monospace">L</text>
      <rect x="132" y="206" width="8" height="14" fill="#EF4444" stroke="#1F2937" stroke-width="0.5"/>
      <line class="anim-refrigerant-flow" x1="132" y1="216" x2="140" y2="216" stroke="#F97316" stroke-width="2" stroke-dasharray="3,2"/>
      <text x="136" y="216" text-anchor="middle" font-size="5" fill="white" font-family="monospace">G</text>
    </g>

    <circle cx="42" cy="86" r="2" fill="#1F2937"/>
    <circle cx="198" cy="86" r="2" fill="#1F2937"/>

    <!-- v0.4.4: 4 根粗铜管（金属底座 + IN1/IN2/OUT1/OUT2） -->
    <rect x="35" y="160" width="170" height="14" rx="2" fill="#374151" stroke="#0F172A" stroke-width="1"/>
    <rect x="35" y="160" width="170" height="3" fill="#6B7280"/>
    <rect x="35" y="171" width="170" height="3" fill="#1F2937"/>
    <rect x="50" y="178" width="14" height="36" rx="3" fill="url(#hpCopper)"/>
    <rect x="80" y="178" width="14" height="36" rx="3" fill="url(#hpCopper)"/>
    <rect x="146" y="178" width="14" height="36" rx="3" fill="url(#hpCopper)"/>
    <rect x="176" y="178" width="14" height="36" rx="3" fill="url(#hpCopper)"/>
    <!-- 铜管内水流粒子（错开延迟） -->
    <circle class="anim-hp-water ahw-1" cx="57" cy="195" r="1.5" fill="#0EA5E9"/>
    <circle class="anim-hp-water ahw-2" cx="87" cy="195" r="1.5" fill="#0EA5E9"/>
    <circle class="anim-hp-water ahw-3" cx="153" cy="195" r="1.5" fill="#F97316"/>
    <circle class="anim-hp-water ahw-4" cx="183" cy="195" r="1.5" fill="#F97316"/>
    <text x="57" y="200" text-anchor="middle" font-size="6" fill="#FFFFFF" font-family="monospace" font-weight="bold">IN1</text>
    <text x="87" y="200" text-anchor="middle" font-size="6" fill="#FFFFFF" font-family="monospace" font-weight="bold">IN2</text>
    <text x="153" y="200" text-anchor="middle" font-size="6" fill="#FFFFFF" font-family="monospace" font-weight="bold">OUT1</text>
    <text x="183" y="200" text-anchor="middle" font-size="6" fill="#FFFFFF" font-family="monospace" font-weight="bold">OUT2</text>
    <!-- 错误码铭牌 -->
    <rect x="100" y="180" width="40" height="14" rx="1" fill="#0F172A" stroke="#22C55E" stroke-width="0.5"/>
    <text data-field="hp_code" x="120" y="190" text-anchor="middle" font-size="7" font-weight="bold" fill="#22C55E" font-family="monospace">E00</text>

    <rect data-click-target="heat-pump" x="0" y="0" width="240" height="220" fill="transparent" pointer-events="all" style="cursor: pointer;"/>
  </g>

  <rect x="55" y="222" width="130" height="14" rx="3" fill="white" stroke="#D1D5DB" stroke-width="0.5"/>
  <text x="120" y="233" text-anchor="middle" font-size="11" fill="#111827" font-family="sans-serif" font-weight="500">热泵机组 · <tspan data-field="hp_capacity">{{hp_capacity}}</tspan></text>
</svg>