<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" id="temp-sensor">
  <defs>
    <radialGradient id="tsProbe" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E5E7EB"/><stop offset="60%" stop-color="#9CA3AF"/><stop offset="100%" stop-color="#374151"/>
    </radialGradient>
    <radialGradient id="tsCover" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/><stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.3"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1"/>
    </radialGradient>
    <linearGradient id="tsLcd" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/><stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="tsMercury" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/><stop offset="100%" stop-color="#FCA5A5"/>
    </linearGradient>
    <linearGradient id="tsCable" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F2937"/><stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="tsLedG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#BBF7D0"/><stop offset="50%" stop-color="#22C55E"/><stop offset="100%" stop-color="#14532D"/>
    </radialGradient>
    <filter id="ds14"><feDropShadow dx="2" dy="4" stdDeviation="2.5" flood-color="#000" flood-opacity="0.35"/></filter>
    <filter id="gl14"><feGaussianBlur stdDeviation="1.5"/></filter>
  </defs>

  <style>
    /* v0.4.8: 水银柱高度由 --anim-ts-temp 驱动 (0=0℃ 1=100℃) */
    .anim-ts-mercury {
      transform: translateY(calc((1 - var(--anim-ts-temp, 0.5)) * 44px));
      height: calc(var(--anim-ts-temp, 0.5) * 44px);
      transition: transform 0.6s ease, height 0.6s ease;
    }
    .anim-ts-value {
      transition: fill 0.4s ease;
      animation: ts-value-breathe 2s ease-in-out infinite;
    }
    @keyframes ts-value-breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
    .anim-ts-trend { animation: ts-trend-blink 1.2s ease-in-out infinite; }
    @keyframes ts-trend-blink { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    /* v0.4.6: 温度指针旋转 (-90° to +90° based on --anim-ts-temp 0~1) */
    .anim-ts-pointer { transform-box: view-box; transition: transform 0.6s ease; }
    .anim-ts-status-led { animation: ts-led-blink 2s ease-in-out infinite; }
    @keyframes ts-led-blink { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
  </style>

  <ellipse cx="120" cy="216" rx="80" ry="8" fill="rgba(0,0,0,0.35)"/>

  <g filter="url(#ds14)" data-component-id="temp-sensor" data-clickable="true" data-animation-id="ts_anim_temp">
    <rect x="30" y="14" width="180" height="20" rx="2" fill="#0F172A"/>
    <text x="120" y="28" text-anchor="middle" font-size="11" font-weight="bold" fill="#FCD34D" font-family="sans-serif">TEMP SENSOR 温度传感器 · PT100</text>
    <!-- v0.4.6: PT100 铭牌 (Class A RTD) -->
    <rect x="60" y="34" width="120" height="10" rx="1" fill="#374151" stroke="#0F172A" stroke-width="0.5"/>
    <text x="120" y="41" text-anchor="middle" font-size="5" fill="#FCD34D" font-family="monospace" font-weight="bold">PT100 RTD · Class A</text>

    <!-- 大型 PT100 探头（r=70） -->
    <circle cx="120" cy="100" r="70" fill="url(#tsProbe)" stroke="#374151" stroke-width="2"/>
    <circle cx="120" cy="100" r="52" fill="url(#tsLcd)" stroke="#1E3A8A" stroke-width="2"/>
    <circle cx="120" cy="100" r="52" fill="none" stroke="#60A5FA" stroke-width="0.5" opacity="0.5"/>
    <!-- v0.4.6: 圆形温度标度盘 (0-100°C, 11 刻度) -->
      <line x1="76.0" y1="100.0" x2="72.0" y2="100.0" stroke="#FFFFFF" stroke-width="0.8"/>
      <text x="80.0" y="100.0" text-anchor="middle" font-size="5" fill="#93C5FD" font-family="monospace" dy="2">0</text>
      <line x1="78.2" y1="86.4" x2="74.3" y2="85.2" stroke="#93C5FD" stroke-width="0.4"/>
      <line x1="84.4" y1="74.1" x2="81.2" y2="71.8" stroke="#FFFFFF" stroke-width="0.8"/>
      <text x="87.6" y="76.5" text-anchor="middle" font-size="5" fill="#93C5FD" font-family="monospace" dy="2">20</text>
      <line x1="94.1" y1="64.4" x2="91.8" y2="61.2" stroke="#93C5FD" stroke-width="0.4"/>
      <line x1="106.4" y1="58.2" x2="105.2" y2="54.3" stroke="#FFFFFF" stroke-width="0.8"/>
      <text x="107.6" y="62.0" text-anchor="middle" font-size="5" fill="#93C5FD" font-family="monospace" dy="2">40</text>
      <line x1="120.0" y1="56.0" x2="120.0" y2="52.0" stroke="#93C5FD" stroke-width="0.4"/>
      <line x1="133.6" y1="58.2" x2="134.8" y2="54.3" stroke="#FFFFFF" stroke-width="0.8"/>
      <text x="132.4" y="62.0" text-anchor="middle" font-size="5" fill="#93C5FD" font-family="monospace" dy="2">60</text>
      <line x1="145.9" y1="64.4" x2="148.2" y2="61.2" stroke="#93C5FD" stroke-width="0.4"/>
      <line x1="155.6" y1="74.1" x2="158.8" y2="71.8" stroke="#FFFFFF" stroke-width="0.8"/>
      <text x="152.4" y="76.5" text-anchor="middle" font-size="5" fill="#93C5FD" font-family="monospace" dy="2">80</text>
      <line x1="161.8" y1="86.4" x2="165.7" y2="85.2" stroke="#93C5FD" stroke-width="0.4"/>
      <line x1="164.0" y1="100.0" x2="168.0" y2="100.0" stroke="#FFFFFF" stroke-width="0.8"/>
      <text x="160.0" y="100.0" text-anchor="middle" font-size="5" fill="#93C5FD" font-family="monospace" dy="2">100</text>
    <text data-field="ts_label" x="120" y="80" text-anchor="middle" font-size="7" fill="#93C5FD" font-family="monospace" opacity="0.8">{{ts_label}}</text>
    <text class="anim-ts-value" data-field="ts_value" x="120" y="108" text-anchor="middle" font-size="26" font-weight="bold" fill="#FFFFFF" font-family="monospace">{{ts_value}}</text>
    <text data-field="ts_unit" x="146" y="104" font-size="11" fill="#93C5FD" font-family="monospace">{{ts_unit}}</text>
    <text class="anim-ts-trend" data-field="ts_trend" x="120" y="122" text-anchor="middle" font-size="8" fill="#FCD34D" font-family="monospace">↑ 0.3</text>

    <!-- 顶部散热鳍 7 道 -->
    <g stroke="#6B7280" stroke-width="2" fill="none" opacity="0.7">
      <line x1="100" y1="40" x2="140" y2="40"/>
      <line x1="96" y1="46" x2="144" y2="46"/>
      <line x1="92" y1="52" x2="148" y2="52"/>
      <line x1="90" y1="58" x2="150" y2="58"/>
      <line x1="92" y1="64" x2="148" y2="64"/>
      <line x1="96" y1="70" x2="144" y2="70"/>
      <line x1="100" y1="76" x2="140" y2="76"/>
    </g>

    <!-- 透明防护罩（v0.4.5 新增：玻璃反光） -->
    <circle cx="120" cy="100" r="76" fill="url(#tsCover)" stroke="#FFFFFF" stroke-width="0.5" opacity="0.8"/>
    <ellipse cx="100" cy="78" rx="14" ry="6" fill="#FFFFFF" opacity="0.5"/>

    <!-- 温度计水银柱（透明柱中水银随温度升降） -->
    <g transform="translate(160, 80)">
      <rect x="0" y="0" width="5" height="44" fill="#1F2937" stroke="#60A5FA" stroke-width="0.3" rx="1"/>
      <rect class="anim-ts-mercury" data-field="ts_mercury" x="0" y="22" width="5" height="22" fill="url(#tsMercury)" rx="1"/>
    </g>

    <!-- 标尺刻度 -->
    <g stroke="#1F2937" stroke-width="0.5" fill="none" opacity="0.7">
      <line x1="105" y1="60" x2="110" y2="60"/>
      <line x1="105" y1="70" x2="110" y2="70"/>
      <line x1="105" y1="80" x2="110" y2="80"/>
      <text x="100" y="62" text-anchor="end" font-size="4" fill="#1F2937" font-family="monospace">50</text>
      <text x="100" y="72" text-anchor="end" font-size="4" fill="#1F2937" font-family="monospace">25</text>
    </g>

    <!-- 底部双绞线 + RJ45 网口 -->
    <path d="M 100 175 Q 90 185 80 192 Q 70 199 70 205" stroke="url(#tsCable)" stroke-width="3" fill="none"/>
    <path d="M 140 175 Q 150 185 160 192 Q 170 199 170 205" stroke="url(#tsCable)" stroke-width="3" fill="none"/>

    <!-- RJ45 网口（v0.4.5 增强：移到 SVG 底部，不在标签外） -->
    <g transform="translate(120, 210)">
      <rect x="-18" y="-3" width="36" height="6" rx="1" fill="#9CA3AF" stroke="#0F172A" stroke-width="0.5"/>
      <g fill="#FCD34D">
        <rect x="-15" y="-2" width="2" height="2"/>
        <rect x="-12" y="-2" width="2" height="2"/>
        <rect x="-9" y="-2" width="2" height="2"/>
        <rect x="-6" y="-2" width="2" height="2"/>
        <rect x="-3" y="-2" width="2" height="2"/>
        <rect x="0" y="-2" width="2" height="2"/>
        <rect x="3" y="-2" width="2" height="2"/>
        <rect x="6" y="-2" width="2" height="2"/>
      </g>
    </g>

    <!-- 状态 LED -->
    <circle class="anim-ts-status-led" data-field="ts_pwr_glow" cx="38" cy="200" r="5" fill="url(#tsLedG)" opacity="0.6" filter="url(#gl14)"/>
    <circle data-field="ts_pwr_led" cx="38" cy="200" r="3" fill="url(#tsLedG)"/>
    <circle data-field="ts_tx_glow" cx="202" cy="200" r="5" fill="url(#tsLedG)" opacity="0.6" filter="url(#gl14)"/>
    <circle data-field="ts_tx_led" cx="202" cy="200" r="3" fill="url(#tsLedG)"/>

    <!-- 螺丝 -->
    <circle cx="50" cy="55" r="2" fill="#1F2937"/>
    <circle cx="190" cy="55" r="2" fill="#1F2937"/>
  </g>

  <rect x="55" y="222" width="130" height="14" rx="3" fill="white" stroke="#D1D5DB" stroke-width="0.5"/>
  <text x="120" y="233" text-anchor="middle" font-size="11" fill="#111827" font-family="sans-serif" font-weight="500">温度传感器 · <tspan data-field="ts_id">{{ts_id}}</tspan></text>
</svg>
