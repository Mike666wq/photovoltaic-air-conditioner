<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" width="240" height="80" id="refrigerant-line">
  <defs>
    <linearGradient id="rlG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0"/><stop offset="50%" stop-color="#2A9D8F"/><stop offset="100%" stop-color="#134E4A"/>
    </linearGradient>
    <radialGradient id="rlGl" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2A9D8F" stop-opacity="0.9"/><stop offset="100%" stop-color="#2A9D8F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rlGl2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.95"/><stop offset="100%" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2A9D8F"/>
    </marker>
    <filter id="gl16"><feGaussianBlur stdDeviation="1.5"/></filter>
    <filter id="gl16S"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>
  <style>
    .anim-rl-particle {
      opacity: 0;
      animation: rl-flow 3s linear infinite;
    }
    @keyframes rl-flow {
      0%   { transform: translateX(0);    opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateX(200px); opacity: 0; }
    }
    /* 雪花闪烁 */
    .rl-snow { animation: snow-pulse 1.5s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes snow-pulse { 0%,100% { opacity: 0.7; } 50% { opacity: 1; } }
    /* 流向箭头 */
    .rl-arrow { animation: arrow-slide 2s ease-in-out infinite; }
    @keyframes arrow-slide { 0%,100% { transform: translateX(0); } 50% { transform: translateX(4px); } }
    /* 制热反向 */
    [data-anim-state="heat"] .anim-rl-particle { animation-direction: reverse; }
    [data-anim-state="cool"] .anim-rl-particle { animation-direction: normal; }
    [data-anim-state="off"] .anim-rl-particle { animation-play-state: paused; opacity: 0.3; }
  </style>

  <!-- 标题栏 -->
  <rect x="2" y="2" width="236" height="14" rx="2" fill="#134E4A"/>
  <g class="rl-snow" transform="translate(8,9)">
    <g stroke="#A7F3D0" stroke-width="0.8" stroke-linecap="round" fill="none">
      <line x1="0" y1="-3" x2="0" y2="3"/>
      <line x1="-3" y1="0" x2="3" y2="0"/>
      <line x1="-2.1" y1="-2.1" x2="2.1" y2="2.1"/>
      <line x1="-2.1" y1="2.1" x2="2.1" y2="-2.1"/>
    </g>
  </g>
  <text x="18" y="11" font-size="8" font-weight="bold" fill="white" font-family="sans-serif">REFRIGERANT · 制冷剂</text>
  <text data-field="rl_label" x="232" y="11" text-anchor="end" font-size="7" fill="#A7F3D0" font-family="monospace">{{rl_label}}</text>

  <!-- 双管：蒸发线（粗）+ 冷凝线（细）-->
  <g stroke-linecap="round">
    <line x1="40" y1="32" x2="220" y2="32" stroke="#2A9D8F" stroke-width="6" marker-end="url(#arrG)"/>
    <line x1="40" y1="32" x2="220" y2="32" stroke="url(#rlG)" stroke-width="3"/>
    <line x1="40" y1="54" x2="220" y2="54" stroke="#0F766E" stroke-width="6"/>
    <line x1="40" y1="54" x2="220" y2="54" stroke="url(#rlG)" stroke-width="3"/>
  </g>

  <!-- 蒸发/冷凝色块标签 -->
  <g>
    <rect x="2" y="28" width="36" height="9" rx="1.5" fill="rgba(167,243,208,0.95)" stroke="#2A9D8F" stroke-width="0.5"/>
    <text x="20" y="34.5" text-anchor="middle" font-size="6" fill="#134E4A" font-family="sans-serif" font-weight="bold">蒸发·气态</text>

    <rect x="2" y="50" width="36" height="9" rx="1.5" fill="rgba(94,234,212,0.95)" stroke="#0F766E" stroke-width="0.5"/>
    <text x="20" y="56.5" text-anchor="middle" font-size="6" fill="#134E4A" font-family="sans-serif" font-weight="bold">冷凝·液态</text>
  </g>

  <!-- 流动粒子（更大更亮，金色对比绿色线条）-->
  <g data-field="rl_particles" data-component-id="refrigerant-line" data-anim-state="cool" data-animation-id="rl_anim_speed">
    <!-- 蒸发线粒子（亮金，对比绿色线条）-->
    <circle class="anim-rl-particle" cx="40" cy="32" r="3.5" fill="#FCD34D" stroke="#FFFFFF" stroke-width="0.6" filter="url(#gl16S)"/>
    <circle class="anim-rl-particle" cx="40" cy="32" r="3"   fill="#FCD34D" stroke="#FFFFFF" stroke-width="0.6" filter="url(#gl16S)"/>
    <circle class="anim-rl-particle" cx="40" cy="32" r="4"   fill="#FCD34D" stroke="#FFFFFF" stroke-width="0.6" filter="url(#gl16S)"/>
    <circle class="anim-rl-particle" cx="40" cy="32" r="3"   fill="#FCD34D" stroke="#FFFFFF" stroke-width="0.6" filter="url(#gl16S)"/>
    <circle class="anim-rl-particle" cx="40" cy="32" r="3.5" fill="#FCD34D" stroke="#FFFFFF" stroke-width="0.6" filter="url(#gl16S)"/>
    <!-- 冷凝线粒子（白色，对比深绿线条）-->
    <circle class="anim-rl-particle" cx="40" cy="54" r="3"   fill="#FFFFFF" stroke="#5EEAD4" stroke-width="0.6" filter="url(#gl16)"/>
    <circle class="anim-rl-particle" cx="40" cy="54" r="3.5" fill="#FFFFFF" stroke="#5EEAD4" stroke-width="0.6" filter="url(#gl16)"/>
    <circle class="anim-rl-particle" cx="40" cy="54" r="3"   fill="#FFFFFF" stroke="#5EEAD4" stroke-width="0.6" filter="url(#gl16)"/>
  </g>

  <!-- 流向箭头 -->
  <g class="rl-arrow" transform="translate(195, 32)">
    <path d="M0,-3 L4,0 L0,3" stroke="#A7F3D0" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>